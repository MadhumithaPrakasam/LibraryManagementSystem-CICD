---
- name: Deploy Library Management System
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    app_image: "library-management-system:latest"
    app_container: "library-management-app"
    data_volume: "library_data"
    app_port: "5001"

  tasks:
    - name: Confirm the tested image exists
      community.docker.docker_image_info:
        name: "{{ app_image }}"
      register: image_info

    - name: Stop if the tested image is missing
      ansible.builtin.fail:
        msg: "The Docker image {{ app_image }} was not found."
      when: image_info.images | length == 0

    - name: Create persistent data volume
      community.docker.docker_volume:
        name: "{{ data_volume }}"
        state: present

    - name: Deploy application container
      community.docker.docker_container:
        name: "{{ app_container }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "{{ app_port }}:5000"
        volumes:
          - "{{ data_volume }}:/app/data"